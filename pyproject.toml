[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truthful-resume-agent"
version = "0.1.0"
description = "Evidence-based JD matching and one-page resume tailoring"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "pydantic>=2.8,<3", "PyMuPDF>=1.24,<2", "python-docx>=1.1,<2", "reportlab>=4.2,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
resume-agent = "ats_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ats_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
